<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pan Tech Africa Admin</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
:root{--bg:#faf6ef;--card:#fff;--tx:#1d1a16;--pr:#0f6b4f;--bd:#e7dfd1}
@media(prefers-color-scheme:dark){:root{--bg:#14120f;--card:#1f1c17;--tx:#f3ede2;--pr:#35b88a;--bd:#38322a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--pr);color:#fff;padding:12px 16px;font-weight:800}main{max-width:1000px;margin:auto;padding:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff;cursor:pointer;min-height:42px}button.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}button.on{outline:3px solid #e8a317}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.stats b{font-size:22px;display:block}
input,select,textarea{padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:2px 0;width:100%}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}.bar{height:14px;background:var(--pr);border-radius:7px}.mu{opacity:.65;font-size:13px}
.low{color:#c77700}</style></head><body>
<header>PAN TECH AFRICA · Admin</header><main id="m"><p>Open in Pi Browser and sign in. Access is limited to approved admin accounts.</p><button onclick="login()">Sign in with Pi</button></main>
<script>
const API="https://pantech-server.onrender.com"; // set to your deployed server
let H,tab='stats',pq='',oq='';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,m='GET',b)=>{const r=await fetch(API+'/api/admin'+p,{method:m,headers:H,body:b&&JSON.stringify(b)});if(r.status==403)throw new Error('You do not have permission to access this page.');if(!r.ok)throw new Error('Request failed');return r.json()};
async function login(){try{Pi.init({version:"2.0",sandbox:true});const a=await Pi.authenticate(['username'],()=>{});H={'Content-Type':'application/json',Authorization:'Bearer '+a.accessToken};show('stats')}catch(e){m.innerHTML='<p>Unable to sign in. Please use Pi Browser.</p>'}}
const m=document.getElementById('m');
function shell(body){m.innerHTML='<div class="tabs">'+['stats','products','orders','returns','users','coupons','announce','tickets','reviews'].map(t=>`<button class="${t==tab?'on':'s'}" onclick="show('${t}')">${t}</button>`).join('')+'</div>'+body+(tab=='stats'?'<button class="s" onclick="backup()">Download backup</button>':'')}
async function show(t){tab=t;try{await V[t]()}catch(e){let id='';try{const r=await fetch(API+'/api/me',{headers:H});if(r.ok){const u=await r.json();id=`<p class="mu">Signed in as ${E(u.username)}.<br>Your Pi ID (give this to the site owner to be made admin):<br><b>${E(u.uid)}</b></p>`}}catch(x){}m.innerHTML=`<div class="card">${E(e.message)}${id}</div>`}}
const V={
async stats(){const s=await api('/stats'),sl=await api('/sales'),mx=Math.max(1,s.orders),sm=Math.max(1,...sl.map(x=>x.s));shell(`<div class="stats">${[['Users',s.users],['Products',s.products],['Orders',s.orders],['Completed',s.completed],['Pending',s.pending],['Cancelled',s.cancelled],['Sales (π)',s.salesPi]].map(x=>`<div class="card"><b>${E(x[1])}</b>${x[0]}</div>`).join('')}</div>
<div class="card"><b>Orders by payment status</b>${[['Completed',s.completed],['Pending',s.pending],['Cancelled',s.cancelled]].map(x=>`<div>${x[0]} (${x[1]})<div class="bar" style="width:${x[1]/mx*100}%"></div></div>`).join('')}</div>
<div class="card"><b>Sales, last 7 days (π)</b>${sl.map(x=>`<div>${E(x.d)}: ${E(x.s)} π (${E(x.c)} orders)<div class="bar" style="width:${x.s/sm*100}%"></div></div>`).join('')||'<div class="mu">No sales yet</div>'}</div><div class="card"><b>Low / out of stock</b>${s.lowStock.map(p=>`<div class="low">${E(p.name)}: ${E(p.stock)} left</div>`).join('')||'<div class="mu">None</div>'}</div>`)},
async products(){const L=(await (await fetch(API+'/api/products?limit=50')).json()).filter(p=>(p.name+p.brand).toLowerCase().includes(pq));shell(`<div class="card"><input placeholder="Search products" value="${E(pq)}" onchange="pq=this.value.toLowerCase();show('products')"></div><div class="card"><b>Add / edit product</b><input type="hidden" id="pid"><div class="g"><input id="pn" placeholder="Name"><input id="pb" placeholder="Brand"><input id="pc" placeholder="Category"><input id="pp" type="number" placeholder="Price (π)"><input id="ps" type="number" placeholder="Stock"></div><textarea id="px" placeholder='Specs as JSON, e.g. {"RAM":"8GB","Storage":"128GB"}'></textarea><label><input type="checkbox" id="pf" style="width:auto"> Featured</label> <label><input type="checkbox" id="po" style="width:auto"> Popular</label> <label><input type="checkbox" id="pw" style="width:auto"> New</label><br><button onclick="saveP()">Save product</button></div>`+L.map(p=>`<div class="card"><b>${E(p.name)}</b> · ${E(p.brand)} · ${E(p.pricePi)} π · stock ${E(p.stock)}<br><button class="s" onclick='edit(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Edit</button> <button class="s" onclick="stock(${+p.id},${+p.stock},1)">+1 stock</button> <button class="s" onclick="stock(${+p.id},${+p.stock},-1)">−1 stock</button> <button class="s" onclick="delP(${+p.id})">Delete</button><div class="mu">Photos ${+p.imgCount||0}/5 · add from your phone gallery:</div><div class="row">${Array.from({length:+p.imgCount||0},(_,i)=>`<span style="position:relative"><img src="${API}/api/products/${+p.id}/image/${i}?t=${Date.now()}" style="height:60px;border-radius:8px"><b onclick="delImg(${+p.id},${i})" style="position:absolute;top:-6px;right:-6px;background:#c0392b;color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;cursor:pointer">×</b></span>`).join('')}</div><input type="file" accept="image/*" multiple onchange="pick(${+p.id},this)"></div>`).join(''))},
async orders(){const L=(await api('/orders')).filter(o=>(o.id+o.orderStatus+o.paymentStatus+o.delivery).toLowerCase().includes(oq));shell('<div class="card"><input placeholder="Search orders (ID, name, status)" value="'+E(oq)+'" onchange="oq=this.value.toLowerCase();show(\'orders\')"><button class="s" onclick="exportCSV()">Export orders (CSV)</button></div>'+(L.map(o=>`<div class="card"><b>${E(o.id)}</b> · ${E(o.totalPi)} π<div class="mu">Payment: ${E(o.paymentStatus)} · Delivery: ${E(o.orderStatus)}</div><div class="mu">${JSON.parse(o.items).map(l=>E(l.name)+' ×'+E(l.qty)).join(', ')}</div><div class="mu">${(d=>E(d.name)+', '+E(d.phone)+', '+E(d.address)+', '+E(d.city))(JSON.parse(o.delivery))}</div>${o.paymentStatus=='Completed'?`<select onchange="setSt('${E(o.id)}',this.value)"><option value="">Update delivery status…</option>${['Processing','Shipped','Out for Delivery','Delivered','Cancelled'].map(s=>`<option>${s}</option>`).join('')}</select>`:'<div class="mu">Awaiting verified payment</div>'}</div>`).join('')||'<div class="card">No orders yet.</div>'))},
async returns(){const L=await api('/returns');shell((L.map(r=>`<div class="card"><b>${E(r.id)}</b> · order ${E(r.orderId)} · ${E(r.status)}<br>${E(r.reason)}<div class="mu">${E(r.note)}</div><select onchange="setRet('${E(r.id)}',this.value)"><option value="">Update status…</option>${['Under Review','Approved','Rejected','Completed'].map(s=>`<option>${s}</option>`).join('')}</select></div>`).join('')||'<div class="card">No return requests.</div>')+'<p class="mu">Approved refunds are sent back manually from your Pi wallet. Then mark the return Completed.</p>')},
async coupons(){const L=await api('/coupons');shell(`<div class="card"><b>New discount code</b><div class="g"><input id="cc" placeholder="Code e.g. WELCOME10"><input id="cp" type="number" placeholder="Percent off (1-90)"><input id="cm" type="number" placeholder="Max uses (0 = unlimited)"><input id="cd" type="number" placeholder="Valid days (0 = no end)"></div><button onclick="saveC()">Save code</button></div>`+L.map(c=>`<div class="card"><b>${E(c.code)}</b> · ${E(c.percent)}% off<div class="mu">Used ${E(c.uses)}${c.maxUses?' / '+E(c.maxUses):''} times${c.expires?' · ends '+new Date(c.expires).toLocaleDateString():''}</div><button class="s" onclick="delC('${E(c.code)}')">Delete</button></div>`).join(''))},
async announce(){shell(`<div class="card"><b>Send an announcement to all customers</b><input id="at" placeholder="Title"><textarea id="ab" placeholder="Message"></textarea><button onclick="sendA()">Send</button></div>`)},
async users(){const L=await api('/users');shell(L.map(u=>`<div class="card"><b>${E(u.username)}</b><div class="mu">Orders: ${E(u.orders)} · Spent: ${E(u.spent)} π · Joined ${new Date(u.created).toLocaleDateString()}</div></div>`).join('')||'<div class="card">No users yet.</div>')},
async tickets(){const L=await api('/tickets');shell(L.map(t=>`<div class="card"><b>${E(t.id)}</b> · ${E(t.subject)} · ${E(t.status)}<br>${E(t.message)}${JSON.parse(t.replies).map(r=>`<div class="mu">↳ ${E(r.text)}</div>`).join('')}<textarea id="r_${E(t.id)}" placeholder="Reply"></textarea><button class="s" onclick="reply('${E(t.id)}')">Send reply</button></div>`).join('')||'<div class="card">No tickets.</div>')},
async reviews(){const L=await api('/reviews');shell(L.map(r=>`<div class="card">⭐${+r.rating} product #${+r.productId}${r.hidden?' (hidden)':''}<br>${E(r.review)}<br>${r.hidden?'':`<button class="s" onclick="hide(${+r.id})">Hide</button>`}</div>`).join('')||'<div class="card">No reviews.</div>')}};
const $=id=>document.getElementById(id);
async function setRet(id,s){if(!s)return;const n=prompt('Note for the customer (optional)')||'';await api('/returns/'+id,'PUT',{status:s,note:n});show('returns')}
async function backup(){try{const r=await fetch(API+'/api/admin/backup',{headers:H});if(!r.ok)throw 0;const b=await r.blob(),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='pta-backup.db';l.click()}catch(e){alert('Backup failed')}}
async function pick(id,inp){const fs=[...inp.files];if(!fs.length)return;let ok=0;for(const f of fs){try{const url=URL.createObjectURL(f);const img=await new Promise((res,rej)=>{const t=new Image();t.onload=()=>res(t);t.onerror=rej;t.src=url});const k=Math.min(1,600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);await api('/products/'+id+'/image','PUT',{image:c.toDataURL('image/jpeg',0.75)});ok++}catch(e){}}alert(ok+' of '+fs.length+' photo(s) saved');show('products')}
async function saveC(){const b={code:$('cc').value,percent:+$('cp').value,maxUses:+$('cm').value,days:+$('cd').value};if(!b.code||!(b.percent>0))return alert('Enter a code and a percent');await api('/coupons','POST',b);show('coupons')}
async function delC(c){if(confirm('Delete code '+c+'?')){await api('/coupons/'+encodeURIComponent(c),'DELETE');show('coupons')}}
async function sendA(){const t=$('at').value.trim(),b=$('ab').value.trim();if(!t||!b)return alert('Enter a title and a message');await api('/announce','POST',{title:t,body:b});alert('Announcement sent');$('at').value='';$('ab').value=''}
async function delImg(id,i){if(confirm('Remove this photo?')){await api('/products/'+id+'/image/'+i,'DELETE');show('products')}}
async function exportCSV(){try{const L=await api('/orders');const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const rows=[['Order','Date','Total Pi','Payment','Delivery','Name','Phone','Address','City','Items']].concat(L.map(o=>{const d=JSON.parse(o.delivery),it=JSON.parse(o.items).map(l=>l.name+' x'+l.qty).join('; ');return [o.id,new Date(o.created).toLocaleString(),o.totalPi,o.paymentStatus,o.orderStatus,d.name,d.phone,d.address,d.city,it]}));const b=new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='orders.csv';a.click()}catch(e){alert('Export failed')}}
async function saveP(){let sp={};try{sp=JSON.parse($('px').value||'{}')}catch{return alert('Specs must be valid JSON')}const b={name:$('pn').value,brand:$('pb').value,category:$('pc').value,pricePi:+$('pp').value,stock:+$('ps').value,specs:sp,featured:$('pf').checked,popular:$('po').checked,isNew:$('pw').checked};if(!b.name||!(b.pricePi>0))return alert('Name and a valid price are required');const id=$('pid').value;await api(id?'/products/'+id:'/products',id?'PUT':'POST',b);show('products')}
function edit(p){$('pid').value=p.id;$('pn').value=p.name;$('pb').value=p.brand;$('pc').value=p.category;$('pp').value=p.pricePi;$('ps').value=p.stock;$('px').value=p.specs;scrollTo(0,0)}
async function stock(id,cur,d){const p=await (await fetch(API+'/api/products?limit=50')).json();const x=p.find(q=>q.id==id);await api('/products/'+id,'PUT',{...x,specs:JSON.parse(x.specs||'{}'),pricePi:x.pricePi,stock:Math.max(0,cur+d)});show('products')}
async function delP(id){if(confirm('Delete this product?')){await api('/products/'+id,'DELETE');show('products')}}
async function setSt(id,s){if(s){await api('/orders/'+id+'/status','PUT',{status:s});show('orders')}}
async function reply(id){const t=$('r_'+id).value.trim();if(t){await api('/tickets/'+id+'/reply','POST',{text:t,status:'Answered'});show('tickets')}}
async function hide(id){await api('/reviews/'+id+'/hide','PUT');show('reviews')}
</script></body></html>
